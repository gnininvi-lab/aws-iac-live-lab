name: AWS IaC Compliance Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  iac-security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. SAST Verification (AWS Security Best Practices)
      - name: Run Checkov SAST Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          soft_fail: false # Hard fail if AWS security baseline defaults are stripped out

      # 2. Plan Generation 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Plan
        run: |
          terraform init
          terraform plan -out=tfplan
          terraform show -json tfplan > tfplan.json

      # 3. OPA/Rego Custom Compliance Policy Verification
      - name: Run OPA Compliance Checks
        uses: open-policy-agent/conftest-action@master
        with:
          files: tfplan.json
          policy: policy
